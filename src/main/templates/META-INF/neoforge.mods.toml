
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="LGPL-3.0-only"
issueTrackerURL="https://github.com/Yuqi154/NeOculus/issues"

[[mods]]
modId="oculus"
version="${mod_version}"
displayURL = "https://curseforge.com/minecraft/mc-mods/neoculus"
displayName="NeOculus"
logoFile="neoculus-logo.png"
authors="NanoLive, dima_dencep, coderbot, IMS212, Justsnoopy30, FoundationGames, Yuqi154"
description='''
Unofficial Fork of "Oculus", made to work with neoforge 1.21+
Unofficial Fork of "Iris", made to work with FML
'''
# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A text field displayed in the mod UI
credits='''
AcceleratedRendering by Argon4W under MIT License
SwayingGarden by joe-vettek , ARR
'''

[[mods]]
modId="iris"
version="${mod_version}"
displayName="Iris"
description='''
Dummy Mod of Iris
'''

[[mixins]]
config="mixins.oculus.json"
[[mixins]]
config="mixins.oculus.fantastic.json"
[[mixins]]
config="mixins.oculus.vertexformat.json"
[[mixins]]
config="mixins.oculus.bettermipmaps.json"
[[mixins]]
config="mixins.oculus.fixes.maxfpscrash.json"
[[mixins]]
config="oculus-batched-entity-rendering.mixins.json"
[[mixins]]
config="mixins.oculus.compat.embeddium.json"
[[mixins]]
config="mixins.oculus.compat.indigo.json"
[[mixins]]
config="mixins.oculus.compat.indium.json"
[[mixins]]
config="mixins.oculus.compat.dh.json"
[[mixins]]
config="mixins.oculus.compat.pixelmon.json"
[[mixins]]
config="mixins.oculus.compat.acceleratedrendering.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.oculus]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.oculus]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.oculus]]
    modId = "embeddium"
    type="required"
    versionRange = "[1.0.0,)"
    ordering = "AFTER"
    side = "CLIENT"
